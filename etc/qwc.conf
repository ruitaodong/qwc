# QWC2 + QGIS Server (Apache 2.4, mod_fcgid). No PHP anywhere.
#
#   /                 QWC2 (theme switcher lists every /web/*.qgs)
#   /?t=<name>        QWC2 opened on project <name>
#   /wms/<name>       QGIS Server WMS for /web/<name>.qgs
#   /maps/<name>      old QGIS Web Client URL, redirects to /?t=<name>

<IfModule mod_fcgid.c>
  # QGIS Server writes its log to stderr, which ends up in Apache's error log
  # (and therefore in `docker logs`). Levels: 0=info, 1=warning, 2=critical.
  FcgidInitialEnv QGIS_SERVER_LOG_STDERR 1
  FcgidInitialEnv QGIS_SERVER_LOG_LEVEL ${QGIS_SERVER_LOG_LEVEL}
  FcgidInitialEnv QT_QPA_PLATFORM offscreen
  # Reload a project when its .qgs file changes (e.g. after re-running qgs.py)
  FcgidInitialEnv QGIS_SERVER_PROJECT_CACHE_STRATEGY filesystem
  # www-data has no writable home; keep QGIS' settings and auth db in /tmp
  FcgidInitialEnv HOME /tmp
  FcgidInitialEnv QGIS_AUTH_DB_DIR_PATH /tmp/
  FcgidIOTimeout 120
  FcgidMaxRequestLen 26214400
</IfModule>

<VirtualHost *:80>
  ServerAdmin webmaster@localhost
  DocumentRoot /QWC2

  <Directory />
    Options None
    AllowOverride None
    Require all denied
  </Directory>

  <Directory /QWC2/>
    Options None
    AllowOverride None
    Require all granted
  </Directory>

  # Config and theme list change at runtime: always revalidate them
  <FilesMatch "^(index\.html|config\.json|themes\.json)$">
    Header set Cache-Control "no-cache"
  </FilesMatch>

  Header always set X-Content-Type-Options "nosniff"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"

  ScriptAlias /cgi-bin/ /usr/lib/cgi-bin/
  <Directory "/usr/lib/cgi-bin/">
    AllowOverride None
    Options +ExecCGI -MultiViews -SymLinksIfOwnerMatch
    Require all granted
    # Let other sites and tools use the WMS (as before)
    Header set Access-Control-Allow-Origin "*"
  </Directory>

  RewriteEngine On

  # Forbid direct access to the CGI directory
  RewriteRule ^/cgi-bin/ - [F]

  # /wms/mapname -> qgis_mapserv.fcgi?map=/web/mapname.qgs
  RewriteRule ^/wms/(.+)$ /cgi-bin/qgis_mapserv.fcgi?map=/web/$1.qgs [QSA,PT]

  # Keep old QGIS Web Client links working
  RewriteRule ^/maps/?$ / [R=301,L]
  RewriteRule ^/maps/([^/.]+)$ /?t=$1 [R=301,L]

  ErrorLog /dev/stderr
  CustomLog /dev/stdout combined
</VirtualHost>
