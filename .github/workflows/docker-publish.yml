name: Docker (qwc2)

# Builds the qwc2 branch into ghcr.io/<owner>/qwc2. GitHub only runs scheduled
# workflows from the default branch, so the weekly rebuild is triggered by
# weekly-rebuild-qwc2.yml, which has to live on the default branch.
on:
  push:
    branches: [qwc2]
    tags: ['v*.*.*']
  pull_request:
    branches: [qwc2]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/qwc2
  PLATFORMS: linux/amd64,linux/arm64

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless cosign signing

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build for the runner's platform first and test it before publishing anything
      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: qwc:test
          cache-from: type=gha,scope=qwc2
          cache-to: type=gha,mode=max,scope=qwc2

      - name: Smoke test
        run: |
          set -eux
          docker run -d --name qwc -p 8080:80 qwc:test
          for _ in $(seq 60); do curl -fsS http://localhost:8080/ >/dev/null && break; sleep 1; done
          # No PHP in the image at all
          docker exec qwc sh -c '! command -v php && ! ls /usr/lib/apache2/modules | grep -qi php'
          docker exec qwc python3 -c 'import json; json.dump({"type": "FeatureCollection", "features": [{"type": "Feature", "properties": {"name": "box"}, "geometry": {"type": "Polygon", "coordinates": [[[1e6, 6e6], [1.1e6, 6e6], [1.1e6, 6.1e6], [1e6, 6e6]]]}}]}, open("/web/test.json", "w"))'
          docker exec qwc qgs.sh test.qgs test.json
          curl -fsS http://localhost:8080/ | grep -q QWC2App.js
          curl -fsS http://localhost:8080/themes.json > themes.json
          jq -e '.themes.items | map(.id) == ["test"]' themes.json
          jq -e '.themes.items[0].url == "/wms/test"' themes.json
          if grep -q localhost themes.json; then exit 1; fi
          test "$(curl -s -o /dev/null -w '%{redirect_url}' http://localhost:8080/maps/test)" = "http://localhost:8080/?t=test"
          curl -fsS "http://localhost:8080/wms/test?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetProjectSettings" | grep -q "<Name>test.json</Name>"
          curl -fsS -o map.png -w '%{content_type}' "http://localhost:8080/wms/test?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap&LAYERS=test.json&CRS=EPSG:3857&BBOX=5.95e6,0.95e6,6.15e6,1.15e6&WIDTH=256&HEIGHT=256&FORMAT=image/png" | grep -q image/png
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/cgi-bin/qgis_mapserv.fcgi)" = 403
          # No CORS by default
          if curl -fsSI "http://localhost:8080/wms/test?SERVICE=WMS&REQUEST=GetCapabilities" | grep -qi access-control-allow-origin; then exit 1; fi
          # Redirects behind a TLS-terminating proxy (e.g. tailscale serve)
          test "$(curl -s -o /dev/null -w '%{redirect_url}' -H 'X-Forwarded-Proto: https' -H 'X-Forwarded-Host: maps.example.ts.net' http://localhost:8080/maps/test)" = "https://maps.example.ts.net/?t=test"
          # Themes are rebuilt from /web on (re)start
          docker exec qwc sh -c 'echo "{\"themes\": {\"items\": []}}" > /QWC2/themes.json'
          curl -fsS http://localhost:8080/themes.json | jq -e '.themes.items | length == 0'
          docker restart qwc
          for _ in $(seq 60); do curl -fsS http://localhost:8080/themes.json | jq -e '.themes.items | length == 1' && break; sleep 1; done
          curl -fsS http://localhost:8080/themes.json | jq -e '.themes.items | length == 1'

      - name: Whole-slide image test (OpenSlide GDAL plugin)
        run: |
          set -eux
          python3 -m venv /tmp/svs
          /tmp/svs/bin/pip install -q tifffile==2026.9.20 imagecodecs==2026.10.10 numpy==2.5.4 pillow==12.3.0
          /tmp/svs/bin/python tests/make_test_svs.py slide.svs
          docker cp slide.svs qwc:/web/slide.svs
          # The plugin reads the 3-level pyramid as overviews
          docker exec qwc python3 -c "from osgeo import gdal; gdal.UseExceptions(); ds = gdal.Open('OPENSLIDE:/web/slide.svs'); assert ds.GetDriver().ShortName == 'OpenSlide'; assert (ds.RasterXSize, ds.RasterYSize, ds.RasterCount) == (6000, 4000, 4); assert ds.GetRasterBand(1).GetOverviewCount() == 2; assert ds.GetMetadataItem('openslide.vendor') == 'aperio'"
          # qgs.py routes slides through OpenSlide
          docker exec qwc qgs.sh slide.qgs slide.svs | tee qgs.log
          grep -q "slide.svs as slide layer" qgs.log
          curl -fsS http://localhost:8080/themes.json | jq -e '.themes.items | map(.id) | index("slide") != null'
          # Rendered upright with the right colours: red, green / blue, white
          curl -fsS -o slide.png "http://localhost:8080/wms/slide?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap&LAYERS=slide.svs&CRS=EPSG:3857&BBOX=0,-4000,6000,0&WIDTH=300&HEIGHT=200&FORMAT=image/png"
          /tmp/svs/bin/python - <<'PY'
          from PIL import Image
          im = Image.open("slide.png").convert("RGB")
          expected = {(40, 25): (220, 40, 40), (260, 25): (40, 200, 40),
                      (40, 175): (40, 40, 220), (260, 175): (250, 250, 250)}
          for xy, want in expected.items():
              got = im.getpixel(xy)
              assert all(abs(a - b) <= 20 for a, b in zip(got, want)), (xy, got, want)
          PY

      - name: Show container logs
        if: always()
        run: docker logs qwc || true

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/qwc2' }}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value={{date 'YYYYMMDD'}},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push multi-arch image
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=qwc2
          cache-to: type=gha,mode=max,scope=qwc2
          provenance: mode=max
          sbom: true

      # Keyless signing with the workflow's OIDC identity (sigstore Fulcio/Rekor).
      # One signature covers every tag: the signed payload names only the digest.
      - name: Sign the published Docker image
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}
        run: |
          # Rekor can record an upload whose response is then lost; the client's
          # retry gets 409 "equivalent entry already exists". Signing again uses
          # a fresh key, so a retry of the whole command gets past it.
          for attempt in 1 2 3; do
            if cosign sign --yes "${IMAGE}"; then exit 0; fi
            echo "cosign sign failed (attempt ${attempt}/3), retrying" >&2
            sleep $((attempt * 15))
          done
          exit 1

      - name: Verify the signature
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}
        run: |
          cosign verify "${IMAGE}" \
            --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            > /dev/null
